spring:

  application:
    name: techmind-ai-academy

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

server:
  port: ${PORT:8080}

app:

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  storage:
    learning-resources-root: ${LEARNING_RESOURCES_ROOT:./storage/learning-resources}
    learning-resources-max-bytes: ${LEARNING_RESOURCES_MAX_BYTES:104857600}

management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics
